# Pengaturan server notifikasi & pembayaran JELAS (Cloudflare Workers).
# Rahasia (SERVICE_ACCOUNT, MIDTRANS_SERVER_KEY, dll.) tetap disimpan di dasbor Cloudflare.
name = "jelas-notif"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true
keep_vars = true

[triggers]
crons = ["0 * * * *"]
