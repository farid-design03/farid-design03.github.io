# Sementara (hanya membaca). Dihapus setelah dipakai.
name: Cek antrean
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cek-mm.yml','.github/scripts/cek-mm.mjs']
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save google-auth-library@9
      - run: node .github/scripts/cek-mm.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
