# Sementara: cek akun murid yang hilang (hanya membaca). Akan dihapus setelah dipakai.
name: Cek akun
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cek-akun.yml','.github/scripts/cek-akun.mjs']
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save google-auth-library@9
      - run: node .github/scripts/cek-akun.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CEK_USER: farid
