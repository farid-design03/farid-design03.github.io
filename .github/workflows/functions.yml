name: Pasang pengirim notifikasi

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Periksa kunci akun layanan
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Rahasia FIREBASE_SERVICE_ACCOUNT belum dipasang di GitHub. Pemasangan dilewati."
          fi
      - uses: actions/checkout@v4
        if: env.SA != ''
      - uses: actions/setup-node@v4
        if: env.SA != ''
        with:
          node-version: 20
      - name: Pasang dependensi
        if: env.SA != ''
        run: cd functions && npm install --no-audit --no-fund
      - name: Kirim ke Firebase
        if: env.SA != ''
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only functions --project jelajah-kelas --force --non-interactive
