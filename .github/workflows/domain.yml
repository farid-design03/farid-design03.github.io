name: Daftarkan alamat baru
on:
  push:
    branches: [main]
    paths: ['.github/workflows/domain.yml']
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save google-auth-library@9
      - run: node .github/scripts/domain.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
